name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Same key every build so updates install over the old app. Set the repo secrets
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD once (see README).
      - name: Load signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/maatram.jks"
            echo "MAATRAM_KEYSTORE=$RUNNER_TEMP/maatram.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: this APK gets a one-off debug key and will not install over the previous build."
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Name APK and hash it
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk maatram-hardlock.apk
          cp maatram-hardlock.apk "maatram-hardlock-v$VERSION.apk"
          sha256sum maatram-hardlock.apk > maatram-hardlock.apk.sha256
          cat maatram-hardlock.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: maatram-hardlock-debug
          path: maatram-hardlock.apk

      # Public download used by maatram.co.in/download.html:
      # https://github.com/MaatramReelsBlocking/maatram-hard-lock/releases/latest/download/maatram-hardlock.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maatram Hard Lock ${{ env.VERSION }} (build ${{ github.run_number }})
          body_path: maatram-hardlock.apk.sha256
          make_latest: true
          files: |
            maatram-hardlock.apk
            maatram-hardlock-v${{ env.VERSION }}.apk
            maatram-hardlock.apk.sha256
