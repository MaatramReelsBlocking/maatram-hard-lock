name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One-time bootstrap: source was uploaded as base64 tar.xz through the web editor.
      - name: Unpack source (first run only)
        if: hashFiles('source.b64') != ''
        run: |
          base64 -d source.b64 | tar -xJf -
          rm source.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Maatram Hard Lock source"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: maatram-hardlock-debug
          path: app/build/outputs/apk/debug/*.apk
