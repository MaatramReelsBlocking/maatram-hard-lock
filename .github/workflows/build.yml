name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name APK and hash it
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk maatram-hardlock.apk
          sha256sum maatram-hardlock.apk > maatram-hardlock.apk.sha256
          cat maatram-hardlock.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: maatram-hardlock-debug
          path: maatram-hardlock.apk

      # Public download used by maatram.co.in/download.html:
      # https://github.com/MaatramReelsBlocking/maatram-hard-lock/releases/latest/download/maatram-hardlock.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maatram Hard Lock (build ${{ github.run_number }})
          body_path: maatram-hardlock.apk.sha256
          make_latest: true
          files: |
            maatram-hardlock.apk
            maatram-hardlock.apk.sha256
